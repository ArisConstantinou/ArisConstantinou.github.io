<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102c26">
  <meta name="description" content="FROG. Εξερεύνησε ένα ζωντανό ρυάκι με κατευθυνόμενα άλματα, φυσικές ικανότητες, ξεχωριστούς συντρόφους και απρόβλεπτα πλάσματα.">
  <meta name="frog-version" content="3.0.0">
  <title>FROG · 3.0.0</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a2119;color:#e9eedb;font-family:system-ui}#boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:20px;padding:24px;background:#0a2119;z-index:1000}#boot .track{height:3px;background:#2a3d32;width:90px;border-radius:4px;overflow:hidden}#boot .track i{display:block;height:100%;background:#d7ec8c;width:45%;animation:boot-load 1.5s ease-in-out infinite alternate}#boot-error:empty{display:none}#boot-error{max-width:600px;font-size:15px;line-height:1.6;white-space:pre-wrap}#boot.has-error .track{display:none}.boot-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}@keyframes boot-load{from{transform:translateX(-90%)}to{transform:translateX(220%)}}@media(prefers-reduced-motion:reduce){#boot .track i{animation:none}}</style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite"><span class="boot-status">Φόρτωση παιχνιδιού</span><div class="track" aria-hidden="true"><i></i></div><div id="boot-error"></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
