<section id="app" hidden><div class="searchbox"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Κωδικός ή περιγραφή…" aria-label="Αναζήτηση κωδικού ή περιγραφής" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="clear" aria-label="Καθαρισμός αναζήτησης" hidden>×</button></div><div class="quick"><button data-query="100">100</button><button data-query="196">196 · Ψυγείο</button><button data-query="A/C">A/C</button><button data-query="RCD">RCD</button></div><div class="tabs" role="tablist"><button id="codes" role="tab" aria-selected="true">Κωδικοί</button><button id="tasks" role="tab" aria-selected="false">Εργασίες έργου</button></div><div class="filters"><select id="area" aria-label="Χώρος έργου"><option value="">Όλο το έργο</option></select><select id="edition" aria-label="Έκδοση καταλόγου"><option value="">Όλα τα φύλλα</option></select><select id="status" aria-label="Αντιστοίχιση"><option value="">Όλες οι αντιστοιχίσεις</option><option value="clear">Αντιστοίχιση περιγραφής</option><option value="review">Σχετικές · έλεγχος</option><option value="missing">Χωρίς τιμή έργου</option></select></div><div class="count"><span id="count" role="status" aria-live="polite"></span><span id="totals"></span></div><div id="results"></div><div class="more"><button class="secondary" id="more" hidden>Περισσότερα αποτελέσματα</button></div><p class="foot">Τιμές πριν από τις συνολικές εκπτώσεις. Δεν προστέθηκε ΦΠΑ. Οι αβέβαιες αντιστοιχίσεις σημειώνονται χωριστά. Ο κατάλογος δεν ενημερώνεται αυτόματα από τα Excel.</p></section>

<dialog id="dialog" class="dialog" aria-labelledby="detail-title"><div class="dialoghead"><h2 id="detail-title">Λεπτομέρειες</h2><button id="close" class="close" aria-label="Κλείσιμο">×</button></div><div id="detail" class="detail"></div></dialog>

<script>
'use strict';
// Preloaded project catalogue; no manual import and no external libraries.
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ς/g,'σ').replace(/[^a-zα-ω0-9]+/g,' ').trim(),compact=v=>norm(v).replace(/ /g,'');
const finite=v=>typeof v==='number'&&Number.isFinite(v),euro=new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}),nf=new Intl.NumberFormat('el-GR',{maximumFractionDigits:3}),money=v=>finite(v)?euro.format(v):'—',number=v=>finite(v)?nf.format(v):'—';
let D=null,P=new Map(),I=new Map(),mode='codes',limit=60,lastFocus=null;
function message(s){$('message').textContent=s;$('message').hidden=!s;}
function validation(d){
 if(!d||d.schemaVersion!==1||!Array.isArray(d.items)||!Array.isArray(d.projectItems)||!Array.isArray(d.areas))throw Error('Δεν φορτώθηκαν τα ενσωματωμένα δεδομένα του έργου. Κάνε ανανέωση της σελίδας.');
 const ids=new Set(),pids=new Set();
 if(d.items.length>20000||d.projectItems.length>20000)throw Error('Ο κατάλογος ξεπερνά το υποστηριζόμενο μέγεθος.');
 for(const p of d.projectItems){if(!p||typeof p.id!=='string'||pids.has(p.id)||typeof p.description!=='string'||!Array.isArray(p.rates))throw Error('Μη έγκυρη γραμμή έργου.');pids.add(p.id);for(const r of p.rates){if(!r||typeof r.area!=='string'||![r.quantity,r.unitPrice,r.lineTotal].every(v=>v===null||finite(v)))throw Error('Μη έγκυρη ποσότητα ή τιμή στα δεδομένα του έργου.');}}
 for(const i of d.items){if(!i||typeof i.id!=='string'||ids.has(i.id)||typeof i.code!=='string'||typeof i.description!=='string'||!Array.isArray(i.links)||!Array.isArray(i.aliases)||!Array.isArray(i.editions)||!Array.isArray(i.sources))throw Error('Μη έγκυρος κωδικός καταλόγου.');ids.add(i.id);for(const l of i.links)if(!l||!pids.has(l.projectId)||!['exact','description','review'].includes(l.status))throw Error('Αντιστοίχιση σε άγνωστη γραμμή έργου.');}
 for(const a of d.areas)if(!a||typeof a.id!=='string'||typeof a.label!=='string')throw Error('Μη έγκυρος χώρος έργου.');
 return d;
}
const label=e=>e==='new'?'NEW':e==='legacy'?'Άλλο φύλλο':e==='system'?'Συστήματα':e;
function load(d){validation(d);D=d;P=new Map(d.projectItems.map(p=>[p.id,p]));I=new Map(d.items.map(i=>[i.id,i]));mode='codes';limit=60;$('search').value='';$('area').innerHTML='<option value="">Όλο το έργο</option>'+d.areas.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.label)+'</option>').join('');const editions=[...new Set(d.items.flatMap(i=>i.editions))];$('edition').innerHTML='<option value="">Όλα τα φύλλα</option>'+editions.map(e=>'<option value="'+esc(e)+'">'+esc(label(e))+'</option>').join('');$('status').value='';$('import-panel').hidden=true;$('app').hidden=false;$('project-name').textContent=d.project||'NOVO CASA 150';$('totals').textContent=new Set(d.items.map(i=>i.code)).size+' κωδικοί';render();}
function rows(p){return p.rates.filter(r=>!$('area').value||r.area===$('area').value);}
function price(item,isProject){let exact=[],review=[];if(isProject)exact=rows(item);else for(const l of item.links){const rr=rows(P.get(l.projectId));if(l.status==='review')review.push(...rr);else exact.push(...rr);}const ex=exact.map(r=>r.unitPrice).filter(finite),rv=review.map(r=>r.unitPrice).filter(finite),status=ex.length?'clear':rv.length?'review':'missing',values=ex.length?ex:rv;return {exact,review,status,values,text:range(values)};}
function range(values){if(!values.length)return 'Χωρίς τιμή έργου';const min=Math.min(...values),max=Math.max(...values);return min===max?money(min):money(min)+' – '+money(max);}
function score(item,isProject,q){if(!q)return 1;const codes=isProject?(item.codeLinks||[]).map(l=>l.code):[item.code],cq=compact(q);if(/^\d+(?:-\d+)?$/.test(q.trim()))return codes.some(c=>compact(c)===cq)?10000:codes.some(c=>compact(c).startsWith(cq))?7000:codes.some(c=>compact(c).includes(cq))?3000:0;const body=isProject?[item.description,item.category,...codes].join(' '):[item.code,item.description,item.category,item.searchExtra,...item.aliases].join(' ');if(cq==='ac'&&/^[a-z/\s]+$/i.test(q.trim()))return norm(body.replace(/\bA\s*\/\s*C\b/gi,'AC')).split(' ').includes('ac')?600:0;const t=norm(body),ct=compact(body);return norm(q).split(' ').every(w=>t.includes(w)||ct.includes(w))?100+(t.includes(norm(q))?100:0):0;}
function render(){if(!D)return;const q=$('search').value,project=mode==='tasks';$('clear').hidden=!q;$('codes').setAttribute('aria-selected',String(!project));$('tasks').setAttribute('aria-selected',String(project));$('edition').disabled=project;$('status').disabled=project;const result=[];for(const item of project?D.projectItems:D.items){const n=score(item,project,q);if(!n)continue;if(project&&!rows(item).length)continue;if(!project&&$('edition').value&&!item.editions.includes($('edition').value))continue;const pr=price(item,project);if(!project&&$('status').value&&pr.status!==$('status').value)continue;if(!project&&$('area').value&&item.links.length&&!item.links.some(l=>rows(P.get(l.projectId)).length))continue;result.push({item,n,pr});}result.sort((a,b)=>b.n-a.n||['clear','review','missing'].indexOf(a.pr.status)-['clear','review','missing'].indexOf(b.pr.status)||String(a.item.code||a.item.row).localeCompare(String(b.item.code||b.item.row),'el',{numeric:true}));$('count').textContent=result.length+' αποτελέσματα'+(q?' για «'+q+'»':'');$('results').innerHTML=result.length?result.slice(0,limit).map(({item,pr})=>'<button class="tag" data-open="'+esc(item.id)+'"><div class="tagtop"><span class="code">'+esc(project?'Γραμμή έργου':item.code)+'</span><span class="edition">'+esc(project?'ΠΡΟΣΦΟΡΑ':item.editions.map(label).join(' · '))+(item.conflict?' · ⚠':'')+'</span></div><p class="desc">'+esc(item.description)+'</p><div class="price '+pr.status+'">'+esc(pr.text)+(pr.status==='clear'?'<small> / μον.</small>':'')+'</div><div class="kind">'+(pr.status==='review'?'Σχετική τιμή · χρειάζεται έλεγχο':pr.status==='missing'?'Ο κωδικός υπάρχει · δεν βρέθηκε τιμή':project?'Τιμή στην προσφορά':'Αντιστοίχιση περιγραφής')+'</div></button>').join(''):'<div class="empty"><h2>Δεν βρέθηκε αποτέλεσμα</h2><p>Δοκίμασε μέρος της περιγραφής ή καθάρισε τα φίλτρα.</p><button class="secondary" data-reset>Εμφάνιση όλων</button></div>';$('more').hidden=result.length<=limit;}
function block(p,l){const rr=rows(p);if(!rr.length)return '';return '<details class="quoteblock '+(l&&l.status==='review'?'review':'')+'" open><summary>'+esc(p.description)+'</summary>'+(l&&l.note?'<p class="note">'+esc(l.note)+'</p>':'')+'<div class="tabscroll"><table class="rates"><thead><tr><th>Χώρος</th><th>Ποσ.</th><th>Τιμή μον.</th><th>Σύνολο</th></tr></thead><tbody>'+rr.map(r=>'<tr><td>'+esc(r.area==='common'?'Κοινόχρ.':r.area==='project'?'Έργο':r.area)+'</td><td>'+number(r.quantity)+'<small>'+esc(r.quantityCell)+'</small></td><td><strong>'+money(r.unitPrice)+'</strong><small>'+esc(r.priceCell)+'</small></td><td>'+money(r.lineTotal)+'<small>'+esc(r.totalCell)+'</small></td></tr>').join('')+'</tbody></table></div><div class="source">'+esc(rr[0].file)+' · '+esc(rr[0].sheet)+'<br>Μονάδα: '+esc(p.unitLabel||'μονάδα γραμμής')+'. Τα μικρά γράμματα δείχνουν τα κελιά προέλευσης.</div></details>';}
function openItem(id){const item=I.get(id)||P.get(id);if(!item)return;const project=P.has(id),pr=price(item,project);lastFocus=document.activeElement;if(lastFocus&&lastFocus.blur)lastFocus.blur();$('detail-title').textContent=project?'Εργασία έργου':'Κωδικός '+item.code;let h=(!project?'<span class="code">'+esc(item.code)+'</span>':'')+'<h3>'+esc(item.description)+'</h3><p class="small">'+esc(item.category)+'</p><div class="heroPrice '+pr.status+'"><small>'+(pr.status==='review'?'Σχετική τιμή · όχι επιβεβαιωμένη':'Τιμή μονάδας έργου')+'</small><div class="price">'+esc(pr.text)+'</div></div>';if(!project&&item.conflict)h+='<div class="warn">Ο ίδιος κωδικός έχει διαφορετικούς ορισμούς σε άλλα φύλλα. Έλεγξε την περιγραφή.</div>';if(project)h+=block(item);else{const links=item.links.filter(l=>rows(P.get(l.projectId)).length),ex=links.filter(l=>l.status!=='review'),rv=links.filter(l=>l.status==='review');if(ex.length)h+='<h4>Ποσότητες και τιμές ανά χώρο</h4>'+ex.map(l=>block(P.get(l.projectId),l)).join('');if(rv.length)h+='<h4 class="review">Σχετικές γραμμές · χρειάζεται έλεγχος</h4>'+rv.map(l=>block(P.get(l.projectId),l)).join('');if(!links.length)h+='<p class="small">Ο κωδικός υπάρχει στον κατάλογο, αλλά δεν βρέθηκε αντιστοιχισμένη γραμμή τιμών. Δεν σημαίνει μηδενική τιμή.</p>';h+='<h4>Προέλευση κωδικού</h4>'+item.sources.map(s=>'<div class="origin"><strong>'+esc(s.sheet)+'</strong><br>'+esc(s.description)+'<br><span class="small">'+esc(s.file)+'<br>Κωδικός '+esc(s.codeCell)+' · Περιγραφή '+esc(s.descriptionCell)+'</span></div>').join('');}h+='<p class="foot">Τιμές πριν από τις συνολικές εκπτώσεις. Δεν προστέθηκε ΦΠΑ.</p>';$('detail').innerHTML=h;const dialog=$('dialog');if(!dialog.open){if(dialog.showModal)dialog.showModal();else dialog.setAttribute('open','');}dialog.scrollTop=0;}
function close(){const d=$('dialog');if(d.close)d.close();else d.removeAttribute('open');if(lastFocus&&lastFocus.focus)lastFocus.focus();}
$('search').addEventListener('input',()=>{limit=60;render();});$('clear').onclick=()=>{$('search').value='';limit=60;render();$('search').focus();};$('codes').onclick=()=>{mode='codes';limit=60;render();};$('tasks').onclick=()=>{mode='tasks';limit=60;render();};for(const id of ['area','edition','status'])$(id).onchange=()=>{limit=60;render();};$('more').onclick=()=>{limit+=60;render();};$('close').onclick=close;$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open)openItem(b.dataset.open);if(b.dataset.query!==undefined){$('search').value=b.dataset.query;limit=60;render();}if(b.hasAttribute('data-reset')){$('search').value='';for(const id of ['area','edition','status'])$(id).value='';limit=60;render();}});
try{load(window.NOVOCASA_DATA);document.documentElement.dataset.ready='true';}catch(e){message('Δεν ολοκληρώθηκε η εκκίνηση: '+e.message);}
</script></body></html>
