name: Captain chaos chapter review
on:
  push:
    branches: [captain-chaos-180]
    paths: ['.github/workflows/captain-chaos180.yml','captain/*180*','captain/tools/*180*','captain/tools/refine_chapter.py','captain/tools/finish_chapter.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: captain-chaos-180
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build isolated chapter
        run: |
          python captain/tools/apply180.py
          python captain/tools/polish180.py
          python captain/tools/refine_chapter.py
          python captain/tools/finish_chapter.py
          for f in captain/*180.js; do node --check "$f"; done
          node --test captain/tests/chaos180.test.mjs
      - name: Install test browser
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Test real controls and story
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/captain180-http.log 2>&1 &
          timeout 480 python captain/tools/qa180.py
      - name: Save validated chapter on staging branch only
        run: |
          mkdir -p captain/tests
          cp /tmp/captain180-qa/results.json captain/tests/verified180.json
          git config user.name 'Captain chapter validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captain/
          if ! git diff --cached --quiet; then
            git commit -m 'Captain 1.8 validated chapter build'
            git push origin HEAD:captain-chaos-180
          fi
      - name: Collect source and rendered evidence
        if: always()
        run: |
          mkdir -p /tmp/captain180-bundle
          cp -R captain /tmp/captain180-bundle/
          cp -R /tmp/captain180-qa /tmp/captain180-bundle/qa 2>/dev/null || true
          git rev-parse HEAD > /tmp/captain180-bundle/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captain180-tested-build
          path: /tmp/captain180-bundle
          retention-days: 7
