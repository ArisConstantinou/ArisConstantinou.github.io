name: Captain identity assets
on:
  push:
    branches: [captain-identity-172]
    paths: ['.github/workflows/captain-identity-assets.yml']
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 human mesh and its license
        run: |
          mkdir -p /tmp/captain-identity/assets
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb' --output /tmp/captain-identity/assets/character.glb
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/QUATERNIUS-LICENSE.txt' --output /tmp/captain-identity/assets/QUATERNIUS-LICENSE.txt
          cp -R captain /tmp/captain-identity/captain
      - uses: actions/upload-artifact@v4
        with:
          name: captain-identity-assets
          path: /tmp/captain-identity
          retention-days: 7
