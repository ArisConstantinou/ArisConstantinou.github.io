name: Captain browser checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['captain/tools/refit130.py', 'captain/tools/polish130.py', '.github/workflows/captain-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed refit
        run: |
          python captain/tools/refit130.py
          python captain/tools/polish130.py
          for f in captain/*.js; do node --check "$f"; done
      - name: Prepare browser
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Real browser interaction tests
        id: qa
        continue-on-error: true
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/captain-http.log 2>&1 &
          python captain/tools/qa130.py
      - name: Commit verified Captain files only
        if: steps.qa.outcome == 'success'
        run: |
          git fetch origin main
          if [ -n "$(git diff --name-only HEAD origin/main -- captain)" ]; then
            echo 'Captain changed during testing; refusing to overwrite newer work.'
            exit 1
          fi
          mkdir -p captain/tests
          cp /tmp/captain-qa/results.json captain/tests/verified130.json
          git config user.name 'Captain verified build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captain/audio.js captain/dialogue130.css captain/dialogue130.js captain/helm130.css captain/helm130.js captain/index.html captain/main.js captain/passengers.js captain/release.json captain/ship.js captain/simulation.js captain/style.css captain/sw.js captain/tools/qa130.py captain/tests/verified130.json
          git commit -m 'Captain 1.3.0: tested wheel touch controls, compact views, predictive warnings and original synthetic voice clips'
          git rebase origin/main
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/captain-qa/verified-commit.txt
      - name: Collect rendered evidence
        if: always()
        run: |
          mkdir -p /tmp/captain-bundle
          cp -R captain /tmp/captain-bundle/captain
          if [ -d /tmp/captain-qa ]; then cp -R /tmp/captain-qa /tmp/captain-bundle/qa; fi
          if [ -f /tmp/captain-http.log ]; then cp /tmp/captain-http.log /tmp/captain-bundle/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captain130-tested-build
          path: /tmp/captain-bundle
          retention-days: 3
      - name: Require successful checks
        if: steps.qa.outcome != 'success'
        run: exit 1
