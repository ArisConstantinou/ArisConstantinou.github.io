name: Captain original voice assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/captain-voices.yml']
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render short original dialogue
        run: |
          python -m pip install -q edge-tts
          python captain/tools/voices130.py
      - name: Save only generated voice pack
        run: |
          git config user.name 'Captain asset builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captain/assets/voices130
          if ! git diff --cached --quiet; then
            git commit -m 'Captain: add original Greek pre-rendered voice pack'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captain-voices130
          path: captain/assets/voices130
          retention-days: 3
