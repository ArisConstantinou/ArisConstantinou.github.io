name: Captain 184 source snapshot
on:
  push:
    branches: [captain-roam-184]
    paths: ['.github/workflows/captain184-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: captain184-source
          path: captain/
          retention-days: 2
