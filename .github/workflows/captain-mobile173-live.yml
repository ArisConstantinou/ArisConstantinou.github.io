name: Captain 1.7.3 public mobile and jail verification
on:
  push:
    branches: [captain-mobile-custody-173]
    paths: ['.github/workflows/captain-mobile173-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact final live release
        run: |
          python - <<'PY'
          import urllib.request,time,hashlib
          from pathlib import Path
          base='https://arisconstantinou.github.io/captain/'
          files=['index.html','main173.js','chaos173.js','ui173.js','mobile173.css','security173.js','chaos-world173.js','sw.js']
          for attempt in range(24):
            try:
              matches=[]
              for f in files:
                data=urllib.request.urlopen(base+f+'?verify=173b-'+str(attempt),timeout=15).read()
                matches.append(data==Path('captain',f).read_bytes())
              if all(matches):break
              print('Waiting for final public release',attempt,matches,flush=True)
            except Exception as e:print(e,flush=True)
            time.sleep(5)
          else:raise SystemExit('Public bytes do not match final tested release')
          for f in files:print('MATCH',f,hashlib.sha256(Path('captain',f).read_bytes()).hexdigest())
          PY
      - name: Install Chromium
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Verify live touch interface and actual arrest to jail
        env:
          CAPTAIN_BASE: https://arisconstantinou.github.io/captain/
        run: python captain/tools/qa173.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captain173-public-mobile-jail
          path: /tmp/captain173-qa/
          retention-days: 7
