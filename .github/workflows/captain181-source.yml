name: Captain 181 source snapshot
on:
  push:
    branches: [captain-fix-181]
    paths: ['.github/workflows/captain181-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: captain181-source
          path: captain/
          retention-days: 2
