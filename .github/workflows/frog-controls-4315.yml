name: FROG camera and WASD regression checks
on:
  push:
    branches: [frog-controls-4.3.15]
    paths:
      - 'frog/source/**'
      - '.github/workflows/frog-controls-4315.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frog-controls-4315
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            frog/source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install reproducible game dependencies
        working-directory: frog/source
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Capture a reproducible offline debugging workspace
        run: |
          git rev-parse HEAD > frog/source/qa-workspace-commit.txt
          tar -czf /tmp/frog-controls-workspace.tgz -C frog source
      - uses: actions/upload-artifact@v4
        with:
          name: frog-controls-workspace
          path: /tmp/frog-controls-workspace.tgz
          retention-days: 2
          compression-level: 0
      - name: Test current rules before changing controls
        working-directory: frog/source
        run: |
          set -o pipefail
          npm test | tee /tmp/frog-controls-tests.log
      - name: Build game
        working-directory: frog/source
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frog-controls-test-log
          path: /tmp/frog-controls-tests.log
          retention-days: 2
