name: Frog controls workspace and QA
on:
  push:
    branches: [fix/frog-4.3.15-controls]
    paths:
      - 'frog/**'
      - '.github/workflows/frog-controls-4315.yml'
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frog/source
            frog/index.html
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked build dependencies and browser driver
        working-directory: frog/source
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Export isolated source and dependencies for local controls testing
        run: |
          tar --exclude=dist -czf frog-controls-workspace.tar.gz frog/source frog/index.html
          ls -lh frog-controls-workspace.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: frog-controls-workspace
          path: frog-controls-workspace.tar.gz
          retention-days: 3
