name: Reset Show browser checks
on:
  push:
    paths:
      - 'funny/**'
      - 'funy/index.html'
      - '.github/workflows/funy-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            funny
            funy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exercise the actual role inversion and all 15 questions
        run: |
          node --check funny/game-v4.js
          node --check funny/questions-v4.js
          python funny/qa-v4.py
      - name: Verify the public funny URL, runtime, assets and one complete reaction
        run: |
          python - <<'PY'
          import json,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('artifacts');out.mkdir(exist_ok=True)
          base='https://arisconstantinou.github.io/funny/'
          errors=[];live=False
          with sync_playwright() as p:
            browser=p.chromium.launch()
            page=browser.new_page(viewport={'width':1440,'height':1050},reduced_motion='reduce')
            page.on('pageerror',lambda e:errors.append(str(e)))
            for attempt in range(24):
              try:
                response=page.goto(base+'?v=4.0.0&check='+str(attempt),wait_until='networkidle',timeout=25000)
                if response and response.status==200 and page.evaluate('window.RESET_GAME?.version')=='4.0.0':
                  assert '/funny/' in page.url
                  assert page.locator('#tiboArt').evaluate('e=>e.complete&&e.naturalWidth>0')
                  assert page.locator('#sam img').evaluate('e=>e.complete&&e.naturalWidth>0')
                  page.click('#start')
                  page.click('#answers button[data-index="1"]');page.click('#lock')
                  page.wait_for_function('document.getElementById("samWord").textContent==="Shhhhhhh"')
                  assert page.locator('#stage').get_attribute('data-mood')=='win'
                  assert page.locator('#playing a,dialog').count()==0
                  page.screenshot(path=str(out/'live-v4-desktop.png'),full_page=True)
                  live=True;break
              except Exception as exc:
                print('Public deployment check:',str(exc)[:180],flush=True)
              time.sleep(10)
            if live:
              page.goto('https://arisconstantinou.github.io/funy/',wait_until='networkidle',timeout=25000)
              assert '/funny/' in page.url and page.evaluate('RESET_GAME.version')=='4.0.0'
              mobile=browser.new_context(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True,reduced_motion='reduce')
              mp=mobile.new_page();mp.goto(base,wait_until='networkidle');mp.click('#start');mp.tap('#answers button[data-index="1"]');mp.tap('#lock')
              mp.wait_for_function('document.getElementById("samWord").textContent==="Shhhhhhh"')
              mp.screenshot(path=str(out/'live-v4-mobile.png'),full_page=True)
              assert mp.locator('#samWord').evaluate('e=>e.scrollWidth<=e.clientWidth+1')
              mp.tap('#dockNext');assert 'QUESTION 02' in mp.locator('#round').inner_text()
            browser.close()
          (out/'live-v4.json').write_text(json.dumps({'live_verified':live,'url':base,'version':'4.0.0','page_errors':errors},indent=2))
          assert live,'The public URL did not serve v4 within the check window'
          assert not errors,errors
          print('LIVE V4 VERIFIED: HTTP 200, correct roles, art, laughter, Sam shush, mobile and legacy redirect',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-show-v4-verified
          path: artifacts/
          retention-days: 30
