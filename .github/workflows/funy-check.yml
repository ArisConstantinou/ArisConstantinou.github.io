name: Reset Show v5 browser checks
on:
  push:
    paths: ['funny/**', '.github/workflows/funy-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            funny
            funy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test real gameplay and articulated animation
        run: |
          node --check funny/actors-v5.js
          node --check funny/game-v5.js
          node --check funny/questions-v5.js
          python funny/qa-v5.py
      - name: Verify deployed funny URL
        run: python funny/qa-v5.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-show-v5-checks
          path: artifacts/
          retention-days: 30
