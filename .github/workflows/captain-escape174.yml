name: Captain 1.7.4 escape validation
on:
  push:
    branches: [captain-escape-174]
    paths: ['captain/escape174.js','captain/escape-model174.js','captain/escape174.css','captain/tools/apply174.py','captain/tools/polish174.py','captain/tools/qa174.py','captain/tests/escape174.test.mjs','.github/workflows/captain-escape174.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: captain-escape174
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Integrate with stable original voyage
        run: |
          git fetch --depth=1 origin db1020c09e13b241f229bd2d477156feb1c59025
          git show db1020c09e13b241f229bd2d477156feb1c59025:captain/index.html > captain/index.html
          git show db1020c09e13b241f229bd2d477156feb1c59025:captain/sw.js > captain/sw.js
          python captain/tools/apply174.py
          python captain/tools/polish174.py
          node --check captain/main174.js
          node --check captain/chaos174.js
          node --check captain/escape174.js
          node --test captain/tests/escape174.test.mjs captain/tests/chaos170.test.mjs
      - name: Prepare browser
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Play continuation and regress desktop and touch controls
        run: |
          python -m http.server 8765 >/tmp/captain-http.log 2>&1 &
          python captain/tools/qa174.py
      - name: Stage tested captain files only
        run: |
          cp /tmp/captain174-qa/results.json captain/tests/verified174.json
          git config user.name 'Captain escape validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add captain/
          git diff --cached --quiet || git commit -m 'Captain 1.7.4 tested continuation from cell to top-down escape and guarded helm return'
          git push origin HEAD:captain-escape-174
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captain174-escape-validation
          path: |
            /tmp/captain174-qa/
            captain/main174.js
            captain/chaos174.js
            captain/escape174.js
            captain/escape-model174.js
            captain/escape174.css
            captain/release.json
          retention-days: 7
