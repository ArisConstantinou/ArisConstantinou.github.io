<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARTH BULWARK · 3D</title><style>body{margin:0;background:#b7afa3;font:16px system-ui;color:#fff}canvas{display:block}header{position:fixed;top:16px;left:16px;background:#172322e8;border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 60px)}select,button{font:16px system-ui;padding:10px;border-radius:6px;border:1px solid #bda27b;background:#e6ddca;color:#29271d}small{display:block;font-size:14px}</style><header><strong>Γ — HEARTH BULWARK<small>Σύρε για περιστροφή · ροδέλα για zoom</small></strong><select id="clip"></select><button id="play">Παύση</button></header><canvas id="view"></canvas><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {loadHearth,createHearth} from './src/hearth-character.js';import {loadCharacters,createCharacter} from './src/characters.js';import {createHearthEffects} from './src/fire-effects.js';
import {poseHearthPilot} from './src/hearth-pilot.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb7afa3);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(6,4.7,7);const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
scene.add(new THREE.HemisphereLight(0xfff2dd,0x625d53,2.2));const light=new THREE.DirectionalLight(0xffe9cd,3);light.position.set(-4,8,5);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-5,right:5,top:6,bottom:-6});scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0xb7afa3,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.9,0);controls.update();
await Promise.all([loadHearth(),loadCharacters()]);const suit=createHearth(),mage=createCharacter('mage');scene.add(suit.group,mage.group);let clip='Idle',time=0,playing=true,last=performance.now();const select=document.getElementById('clip');select.innerHTML=[...suit.clips.keys()].map(name=>`<option>${name}</option>`).join('');select.value=clip;select.onchange=()=>{clip=select.value;time=0;playing=true;document.getElementById('play').textContent='Παύση';};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Παύση':'Συνέχεια';};
const fireFX=createHearthEffects(scene);
function draw(dt){const fuel=['Sleep','Deplete'].includes(clip)?0:100;suit.update(dt,{clip,time,fuel});const climbing=['Board','Exit'].includes(clip);mage.group.visible=climbing||['Idle','Walk','Fire','Throw'].includes(clip);mage.group.scale.setScalar(.72);const anchor=suit.point('pilot');let position=anchor;
 const t=THREE.MathUtils.clamp(time/2.4,0,1),v=clip==='Board'?t:1-t,onLadder=climbing&&v>=.2&&v<=.85;
 if(climbing){const start=new THREE.Vector3(0,.02,-2.4),back=new THREE.Vector3(0,.05,-1.43),top=new THREE.Vector3(0,2.32,-.88);position=v<.2?start.lerp(back,v/.2):v<.85?back.lerp(top,(v-.2)/.65):top.lerp(anchor,(v-.85)/.15);}
 mage.group.position.copy(position);mage.update(dt,{moving:climbing&&!onLadder,speed:1,casting:!climbing});if(mage.group.visible&&(!climbing||onLadder))poseHearthPilot(mage,suit,{climbing:onLadder,progress:(v-.2)/.65});fireFX.update({spell:{charged:false},player:{body:{position:new THREE.Vector3()}},hearth:{visual:suit,heart:{fuel,firing:clip==='Fire'},jetLength:5},entities:[],time,camera});controls.update();renderer.render(scene,camera);}
window.__HEARTH_VIEWER__={suit,mage,camera,renderer,THREE,set:(name,t)=>{clip=name;select.value=name;time=t;playing=false;document.getElementById('play').textContent='Συνέχεια';draw(0);},view:p=>{camera.position.fromArray(p);controls.update();draw(0);}};window.render_game_to_text=()=>JSON.stringify({clip,time,bones:Object.keys(suit.bones),render:renderer.info.render});
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing){time=(time+dt)%suit.clips.get(clip).duration;}draw(dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
