<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {loadBossCharacters,createBossCharacter} from '/src/boss-characters.js';
const type=new URLSearchParams(location.search).get('type')||'colossus';
await loadBossCharacters([type]);const boss=createBossCharacter(type);
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd9d8d3);scene.add(boss.group);

const sun=new THREE.DirectionalLight(0xfff6e3,3.8);sun.position.set(-4,7,5);sun.castShadow=true;sun.shadow.normalBias=.04;sun.shadow.bias=-.0001;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const select=document.querySelector('#clip');for(const name of boss.clips.keys())select.add(new Option(name,name));select.value=clip;
select.onchange=()=>{clip=select.value;elapsed=0;auto=true;boss.reset();document.querySelector('#play').textContent='Παύση';};
document.querySelector('#play').onclick=e=>{auto=!auto;e.target.textContent=auto?'Παύση':'Αναπαραγωγή';};controls.addEventListener('change',draw);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);draw();});
window.__BOSS_VIEWER__={boss,scene,camera,renderer,set:(name,time)=>{auto=false;clip=name;elapsed=time;boss.update(.1,{clip:name,time});draw();},play:name=>{clip=name;elapsed=0;auto=true;boss.reset();},view:direction=>{camera.position.set(...direction);camera.lookAt(0,1.65,0);draw();}};

function frame(now){const dt=Math.max(0,Math.min(.04,(now-last)/1000));last=now;if(auto){const duration=boss.clips.get(clip).duration;elapsed=['Idle','Walk','Hover'].includes(clip)?(elapsed+dt)%duration:Math.min(duration,elapsed+dt);boss.update(dt,{clip,time:elapsed});draw();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
