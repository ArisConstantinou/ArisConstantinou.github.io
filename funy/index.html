<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who Wants a Global Reset?</title><style>body{margin:0;background:#11152a;color:#fff;font:16px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:22px}h1{color:#ffd76b;font-size:clamp(27px,6vw,52px)}.stage{background:linear-gradient(140deg,#24205a,#101a3d);border:3px solid #e3bb5b;border-radius:24px;padding:25px;box-shadow:0 0 35px #7050ff55}.host{font-size:75px;animation:bob 2s infinite alternate}@keyframes bob{to{transform:translateY(-9px) rotate(4deg)}}button{border:2px solid #a6b7ff;border-radius:14px;background:#273a76;color:white;padding:15px;cursor:pointer;font-size:16px}button:hover{background:#4258a2}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}@media(max-width:550px){.answers{grid-template-columns:1fr}}.muted{color:#b9c2e0}#reaction{min-height:65px;font-size:21px;font-weight:bold;color:#ffe18d}.pill{display:inline-block;background:#40336b;padding:8px 14px;border-radius:99px}footer{font-size:12px;color:#b5b9d0;margin-top:30px}</style><main><div class="pill">THE COMMUNITY GAME SHOW • PARODY</div><h1>WHO WANTS A GLOBAL RESET? 🎤</h1><div class="stage"><div class="host" id="host">🤵‍♂️</div><p class="muted" id="round">QUESTION 1 / 8</p><h2 id="question"></h2><div class="answers" id="answers"></div><div id="reaction" aria-live="polite"></div><button id="next" hidden>Next disaster →</button><p class="muted" id="score"></p></div><footer>A fictional satire about community feedback, promises and delivery. Not affiliated with OpenAI or any real individual.</footer></main><script>const qs=[["Users ask for a global reset. What do you deliver?",["A global reset","A beautifully worded 'soon™'","A countdown that resets itself","A surprise survey"],1,"COMING SOON™ has won the jackpot!"],["The community asks for transparency. Your response?",["Clear rules","A mysterious progress bar","A detailed changelog","An honest timeline"],1,"The progress bar is decorative. It has feelings, though."],["What does 'listening to feedback' mean?",["Reading and acting on feedback","Turning replies off","Pinning a motivational quote","Asking for feedback again"],3,"Your feedback about feedback has been forwarded to feedback."],["Players need more usage. What's the solution?",["Predictable fair limits","A new tier with a bigger number","Explain the actual policy","Show a usage calculator"],1,"Congratulations! The price leveled up."],["What happens when the reset clock hits zero?",["Usage resets","The clock gets a sequel","Everyone gets a clear explanation","The community celebrates"],1,"RESET 2: THE RESETTING."],["A user asks 'when exactly?' You say...",["October 15 at 8 PM","By end of day... somewhere","Here is the confirmed schedule","I don't know yet"],1,"Time zones are now a boss battle."],["The roadmap promises a feature. Launch day arrives. You ship...",["The feature","A teaser for the teaser","Release notes and feature","A working demo"],1,"The trailer has a trailer!"],["Final question: Who deserves the million?",["The community","The 'soon' button","The actual developers","Everyone who waited patiently"],0,"PLOT TWIST: The community wins. Please deliver the prize this time!"]];let i=0,points=0;const el=id=>document.getElementById(id);function draw(){let q=qs[i];el("round").textContent="QUESTION "+(i+1)+" / "+qs.length;el("question").textContent=q[0];el("answers").innerHTML="";el("reaction").textContent="";el("next").hidden=true;el("host").textContent="🤵‍♂️";q[1].forEach((a,j)=>{let b=document.createElement("button");b.textContent=String.fromCharCode(65+j)+": "+a;b.onclick=()=>answer(j);el("answers").append(b)});el("score").textContent="Community points: "+points}function answer(j){let q=qs[i];[...el("answers").children].forEach(b=>b.disabled=true);let sat=j===q[2];if(sat)points++;el("host").textContent=sat?"🤡":"😳";el("reaction").textContent=sat?q[3]:"Too sensible! The fictional host is visibly confused. 😂";el("next").hidden=false;el("next").textContent=i===qs.length-1?"Play again ↻":"Next disaster →";el("score").textContent="Community points: "+points}el("next").onclick=()=>{i++;if(i===qs.length){i=0;points=0}draw()};draw();</script></html>
